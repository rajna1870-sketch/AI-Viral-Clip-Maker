
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Viral Clip Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101522;color:white;font-family:Arial,sans-serif}
.container{max-width:500px;margin:35px auto;background:#1b2435;padding:24px;border-radius:18px}
h1{text-align:center;color:#7c9cff}
p{text-align:center;color:#c4ccdc}
label{display:block;margin:18px 0 8px}
input,select,button{width:100%;padding:14px;border:0;border-radius:9px;font-size:16px}
input,select{background:#303c51;color:white}
button{margin-top:22px;background:#5278ff;color:white;font-weight:bold}
.note{font-size:12px;color:#aeb9cc}
</style>
</head>
<body>
<div class="container">
<h1>AI Viral Clip Maker</h1>
<p>अपने वीडियो से शानदार Shorts बनाएँ</p>

<label>वीडियो का लिंक डालें</label>
<input type="url" placeholder="अपना वीडियो लिंक डालें">

<label>कितनी क्लिप चाहिए?</label>
<select>
<option>एक सबसे अच्छी क्लिप</option>
<option>5 क्लिप</option>
<option>10 क्लिप</option>
</select>

<label>सबटाइटल की भाषा</label>
<select>
<option>हिंदी</option>
<option>English</option>
</select>

<label>वीडियो की गुणवत्ता</label>
<select>
<option>AI Smart - स्रोत के अनुसार 4K तक</option>
<option>1080p</option>
<option>2K</option>
<option>4K</option>
</select>

<button onclick="alert('अभी वीडियो बनाने वाला AI इंजन जोड़ना बाकी है।')">
वीडियो बनाएँ
</button>
<p class="note">यह शुरुआती वेबसाइट है। AI इंजन अगले चरणों में जुड़ेगा।</p>
</div>
</body>
</html>
