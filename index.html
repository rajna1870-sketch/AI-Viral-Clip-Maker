
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Viral Clip Maker</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;background:#101522;
 color:white;font-family:Arial,sans-serif
}
.container{
 max-width:520px;margin:20px auto;
 background:#1b2435;padding:22px;border-radius:18px
}
h1{text-align:center;color:#7c9cff}
p{text-align:center;color:#c4ccdc}
label{display:block;margin:20px 0 9px}
input,button{
 width:100%;padding:14px;border:0;
 border-radius:9px;font-size:16px
}
input{background:#303c51;color:white}
button{
 margin-top:15px;background:#5278ff;
 color:white;font-weight:bold
}
button:disabled{opacity:.5}
.note{font-size:12px;color:#aeb9cc}
#status{margin-top:18px;text-align:center}
.clip{
 background:#303c51;padding:15px;
 border-radius:12px;margin-top:15px
}
.clip h3{color:#9db3ff}
.clip a{
 display:block;text-align:center;
 background:#5278ff;color:white;
 padding:12px;border-radius:8px;
 text-decoration:none;margin-top:12px
}
video{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>
<body>

<div class="container">
<h1>AI Viral Clip Maker</h1>
<p>अपनी वीडियो से शानदार Shorts बनाएँ</p>

<label>अपनी MP4 वीडियो चुनें</label>
<input type="file" id="video" accept="video/mp4,video/quicktime,video/webm,video/x-matroska">

<button id="makeBtn" onclick="makeBestClips()">
सबसे अच्छी क्लिप बनाएँ
</button>

<div id="status"></div>
<div id="clips"></div>

<p class="note">
अधिकतम वीडियो आकार 200 MB है।
वीडियो का विश्लेषण करके उपलब्ध अच्छे दृश्यों की क्लिप बनाई जाएँगी।
</p>
</div>

<script>
const API="";

async function makeBestClips(){
 const file=document.getElementById("video").files[0];
 const status=document.getElementById("status");
 const clips=document.getElementById("clips");
 const btn=document.getElementById("makeBtn");

 clips.innerHTML="";

 if(!file){
   status.textContent="पहले वीडियो चुनें।";
   return;
 }

 if(file.size>200*1024*1024){
   status.textContent="वीडियो 200 MB से छोटी होनी चाहिए।";
   return;
 }

 const data=new FormData();
 data.append("video",file);

 btn.disabled=true;
 status.textContent="वीडियो का विश्लेषण हो रहा है। कृपया प्रतीक्षा करें...";

 try{
   const response=await fetch(API+"/make-best-clips",{
     method:"POST",
     body:data
   });

const text = await response.text();

let result;
try {
  result = JSON.parse(text);
} catch (e) {
  throw new Error("सर्वर ने JSON के बजाय HTML भेजा। कृपया API पते की जाँच करें।");
}

   if(!response.ok){
     throw new Error(result.detail || "वीडियो नहीं बन पाई");
   }

   status.textContent="कुल "+result.total_clips+" क्लिप तैयार हैं!";

   result.clips.forEach((clip)=>{
     const card=document.createElement("div");
     card.className="clip";

     const title=document.createElement("h3");
     title.textContent=clip.title;

     const duration=document.createElement("p");
     duration.textContent="अवधि: "+clip.duration+" सेकंड";

     const video=document.createElement("video");
     video.controls=true;
     video.src=API+clip.download_url;

     const download=document.createElement("a");
     download.href=API+clip.download_url;
     download.download=clip.filename;
     download.textContent="MP4 वीडियो डाउनलोड करें";

     card.append(title,duration,video,download);
     clips.append(card);
   });

 }catch(error){
   status.textContent="त्रुटि: "+error.message;
 }finally{
   btn.disabled=false;
 }
}
</script>
</body>
</html>
