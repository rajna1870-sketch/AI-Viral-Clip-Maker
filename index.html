
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Viral Clip Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101522;color:white;font-family:Arial,sans-serif}
.container{max-width:500px;margin:25px auto;background:#1b2435;padding:24px;border-radius:18px}
h1{text-align:center;color:#7c9cff}
p{text-align:center;color:#c4ccdc}
label{display:block;margin:18px 0 8px}
input,select,button{width:100%;padding:14px;border:0;border-radius:9px;font-size:16px}
input,select{background:#303c51;color:white}
button{margin-top:15px;background:#5278ff;color:white;font-weight:bold}
button:disabled{opacity:.5}
.note{font-size:12px;color:#aeb9cc}
#info{margin-top:15px;overflow-wrap:anywhere}
img{width:100%;border-radius:10px;margin-top:10px}
video{width:100%;margin-top:20px;border-radius:12px}
.section{margin-top:25px;padding-top:15px;border-top:1px solid #46516a}
</style>
</head>
<body>
<div class="container">
<h1>AI Viral Clip Maker</h1>
<p>अपनी वीडियो से शानदार Shorts बनाएँ</p>

<div class="section">
<h3>तरीका 1 – YouTube लिंक</h3>
<label>YouTube वीडियो का लिंक डालें</label>
<input id="youtubeUrl" type="url"
placeholder="YouTube लिंक यहाँ डालें">

<button id="checkBtn" onclick="checkYoutube()">
YouTube वीडियो पहचानें
</button>
<div id="info"></div>
</div>

<div class="section">
<h3>तरीका 2 – फोन से वीडियो</h3>
<label>अपनी वीडियो चुनें</label>
<input type="file" id="video"
accept="video/mp4,video/quicktime,video/webm,video/x-matroska">

<label>क्लिप की अवधि</label>
<select id="duration">
<option value="15">15 सेकंड</option>
<option value="30" selected>30 सेकंड</option>
<option value="45">45 सेकंड</option>
<option value="60">60 सेकंड</option>
</select>

<button id="makeBtn" onclick="makeClip()">
वीडियो बनाएँ
</button>

<div id="status"></div>
<video id="result" controls hidden></video>
<a id="download" hidden download="viral_clip.mp4">
<button type="button">वीडियो डाउनलोड करें</button>
</a>
</div>

<p class="note">
YouTube लिंक से अभी वीडियो की जानकारी मिलेगी।
वीडियो काटने के लिए अपनी या अनुमति प्राप्त वीडियो फ़ाइल अपलोड करें।
AI द्वारा सबसे अच्छे क्षण चुनने की सुविधा अभी बननी बाकी है।
</p>
</div>

<script>
const API="https://ai-viral-clip-maker.onrender.com";

async function checkYoutube(){
 const url=document.getElementById("youtubeUrl").value.trim();
 const info=document.getElementById("info");
 const btn=document.getElementById("checkBtn");

 if(!url){
   info.textContent="पहले YouTube लिंक डालें।";
   return;
 }

 btn.disabled=true;
 info.textContent="वीडियो की जानकारी खोज रहे हैं...";

 try{
   const data=new FormData();
   data.append("url",url);

   const response=await fetch(API+"/youtube-info",{
     method:"POST",body:data
   });

   const result=await response.json();
   if(!response.ok) throw new Error(result.detail);

   info.innerHTML="";
   const title=document.createElement("h3");
   title.textContent=result.title || "शीर्षक उपलब्ध नहीं";
   const channel=document.createElement("p");
   channel.textContent="चैनल: "+(result.channel || "उपलब्ध नहीं");
   info.append(title,channel);

   if(result.thumbnail){
     const img=document.createElement("img");
     img.src=result.thumbnail;
     img.alt="वीडियो थंबनेल";
     info.append(img);
   }
 }catch(error){
   info.textContent="त्रुटि: "+error.message;
 }finally{
   btn.disabled=false;
 }
}

async function makeClip(){
 const file=document.getElementById("video").files[0];
 const duration=document.getElementById("duration").value;
 const status=document.getElementById("status");
 const btn=document.getElementById("makeBtn");

 if(!file){
   status.textContent="पहले फोन से वीडियो चुनें।";
   return;
 }
 if(file.size>200*1024*1024){
   status.textContent="वीडियो 200 MB से छोटी होनी चाहिए।";
   return;
 }

 const data=new FormData();
 data.append("video",file);
 data.append("duration",duration);

 btn.disabled=true;
 status.textContent="वीडियो बनाई जा रही है...";

 try{
   const response=await fetch(API+"/make-clip",{
     method:"POST",body:data
   });
   if(!response.ok){
     const error=await response.json();
     throw new Error(error.detail || "वीडियो नहीं बनी");
   }

   const blob=await response.blob();
   const url=URL.createObjectURL(blob);

   const result=document.getElementById("result");
   result.src=url;
   result.hidden=false;

   const download=document.getElementById("download");
   download.href=url;
   download.hidden=false;

   status.textContent="आपकी क्लिप तैयार है!";
 }catch(error){
   status.textContent="त्रुटि: "+error.message;
 }finally{
   btn.disabled=false;
 }
}
</script>
</body>
</html>
