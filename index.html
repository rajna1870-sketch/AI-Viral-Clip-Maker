

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Viral Clip Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101522;color:white;font-family:Arial,sans-serif}
.container{max-width:500px;margin:25px auto;background:#1b2435;padding:24px;border-radius:18px}
h1{text-align:center;color:#7c9cff}
p{text-align:center;color:#c4ccdc}
label{display:block;margin:18px 0 8px}
input,select,button{width:100%;padding:14px;border:0;border-radius:9px;font-size:16px}
input,select{background:#303c51;color:white}
button{margin-top:22px;background:#5278ff;color:white;font-weight:bold}
button:disabled{opacity:.5}
.note{font-size:12px;color:#aeb9cc}
video{width:100%;margin-top:20px;border-radius:12px}
#status{margin-top:15px;text-align:center;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h1>AI Viral Clip Maker</h1>
<p>अपनी वीडियो से शानदार Shorts बनाएं</p>

<label>अपनी वीडियो चुनें</label>
<input type="file" id="video" accept="video/mp4,video/quicktime,video/x-matroska,video/webm">

<label>क्लिप की अवधि चुनें</label>
<select id="duration">
<option value="15">15 सेकंड</option>
<option value="30" selected>30 सेकंड</option>
<option value="45">45 सेकंड</option>
<option value="60">60 सेकंड</option>
</select>

<button id="makeBtn" onclick="makeClip()">वीडियो बनाएं</button>

<div id="status"></div>
<video id="result" controls hidden></video>
<a id="download" hidden download="viral_clip.mp4">
<button type="button">वीडियो डाउनलोड करें</button>
</a>

<p class="note">
अभी यह शुरुआती चुनी गई अवधि की क्लिप बनाता है।
AI वायरल क्षण चुनने की सुविधा अभी तैयार नहीं है।
</p>
</div>

<script>
async function makeClip(){
 const file=document.getElementById("video").files[0];
 const duration=document.getElementById("duration").value;
 const status=document.getElementById("status");
 const btn=document.getElementById("makeBtn");

 if(!file){
   status.textContent="पहले अपने फोन से वीडियो चुनें।";
   return;
 }

 if(file.size>200*1024*1024){
   status.textContent="वीडियो 200 MB से छोटी होनी चाहिए।";
   return;
 }

 const data=new FormData();
 data.append("video",file);
 data.append("duration",duration);

 btn.disabled=true;
 status.textContent="वीडियो बन रही है, कृपया प्रतीक्षा करें...";

 try{
   const response=await fetch(
     "https://ai-viral-clip-maker.onrender.com/make-clip",
     {method:"POST",body:data}
   );

   if(!response.ok){
     const error=await response.json();
     throw new Error(error.detail || "वीडियो नहीं बन पाई");
   }

   const blob=await response.blob();
   const url=URL.createObjectURL(blob);

   const result=document.getElementById("result");
   result.src=url;
   result.hidden=false;

   const download=document.getElementById("download");
   download.href=url;
   download.hidden=false;

   status.textContent="आपकी वीडियो तैयार है!";
 }catch(error){
   status.textContent="त्रुटि: "+error.message;
 }finally{
   btn.disabled=false;
 }
}
</script>
</body>
</html>
