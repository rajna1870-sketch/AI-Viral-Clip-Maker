
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Viral Clip Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101522;color:white;font-family:Arial}
.container{max-width:520px;margin:20px auto;background:#1b2435;padding:22px;border-radius:18px}
h1{text-align:center;color:#7c9cff}
p{text-align:center;color:#c4ccdc}
input,button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;font-size:16px}
input{background:#303c51;color:white}
button{background:#5278ff;color:white;font-weight:bold}
button:disabled{opacity:.5}
#status{margin-top:18px;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere}
.clip{background:#303c51;padding:15px;border-radius:12px;margin-top:15px}
.clip h3{color:#9db3ff}
.clip a{display:block;text-align:center;background:#5278ff;color:white;padding:12px;border-radius:8px;text-decoration:none;margin-top:12px}
video{width:100%;border-radius:10px;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>AI Viral Clip Maker</h1>
<p>अपनी वीडियो से शानदार Shorts बनाएँ</p>
<label>अपनी वीडियो चुनें</label>
<input type="file" id="video" accept=".mp4,.mov,.mkv,.webm">
<button id="makeBtn">सबसे अच्छी क्लिप बनाएँ</button>
<div id="status"></div>
<div id="clips"></div>
</div>

<script>
const btn=document.getElementById("makeBtn");
const statusBox=document.getElementById("status");
const clipsBox=document.getElementById("clips");

btn.addEventListener("click",makeBestClips);

async function makeBestClips(){
 const file=document.getElementById("video").files[0];
 clipsBox.innerHTML="";

 if(!file){
  statusBox.textContent="पहले वीडियो चुनें।";
  return;
 }

 if(file.size>200*1024*1024){
  statusBox.textContent="वीडियो 200 MB से छोटी होनी चाहिए।";
  return;
 }

 const data=new FormData();
 data.append("video",file);

 btn.disabled=true;
 statusBox.textContent="वीडियो भेजी जा रही है। कृपया प्रतीक्षा करें...";

 try{
  const response=await fetch("/make-best-clips",{
   method:"POST",
   body:data
  });

  const text=await response.text();
  let result;

  try{
   result=JSON.parse(text);
  }catch(e){
   throw new Error("सर्वर का जवाब समझ नहीं आया। HTTP "+response.status+" "+text.slice(0,200));
  }

  if(!response.ok){
   throw new Error(result.detail||"सर्वर त्रुटि "+response.status);
  }

  if(!Array.isArray(result.clips)){
   throw new Error("क्लिप की सूची नहीं मिली।");
  }

  statusBox.textContent="कुल "+result.total_clips+" क्लिप तैयार हैं।";

  result.clips.forEach(clip=>{
   const card=document.createElement("div");
   card.className="clip";

   const title=document.createElement("h3");
   title.textContent=clip.title;

   const duration=document.createElement("p");
   duration.textContent="अवधि: "+clip.duration+" सेकंड";

   const player=document.createElement("video");
   player.controls=true;
   player.src=clip.download_url;

   const link=document.createElement("a");
   link.href=clip.download_url;
   link.textContent="MP4 वीडियो डाउनलोड करें";
   link.download=clip.filename;

   card.append(title,duration,player,link);
   clipsBox.appendChild(card);
  });

  if(result.clips.length===0){
   statusBox.textContent="कोई अच्छी क्लिप नहीं मिली। दूसरी वीडियो आजमाएँ।";
  }

 }catch(error){
  statusBox.textContent="त्रुटि: "+error.message;
 }finally{
  btn.disabled=false;
 }
}
</script>
</body>
</html>
